apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: app
  labels:
    app: file-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      serviceAccountName: app-sa
      containers:
      - name: file-service
        # Replace with your actual ECR image URI
        image: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/file-service:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
        env:
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_SERVER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_SERVER
        - name: MYSQL_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_PORT
        - name: MYSQL_DB_FILE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_DB_FILE
        - name: DATABASE_URL
          value: "mysql+pymysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@$(MYSQL_SERVER):$(MYSQL_PORT)/$(MYSQL_DB_FILE)"
        - name: MYSQL_DB_FILE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_DB_FILE
        - name: AWS_REGION_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: AWS_REGION_NAME
        - name: AWS_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: AWS_BUCKET_NAME
        # Service Links
        - name: LOGIN_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOGIN_SERVICE_URL
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "app-secrets-provider"
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: app
spec:
  selector:
    app: file-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-service-hpa
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70