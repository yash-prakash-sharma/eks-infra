apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/group.name: "my-app-shared-alb"
    alb.ingress.kubernetes.io/group.order: "100"
    
    # Listen on HTTP (80) and HTTPS (443)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    
    # Automatically redirect HTTP to HTTPS
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    
    # Attach your Hostinger Domain's ACM Certificate (Replace this with the outputs from Terraform)
    alb.ingress.kubernetes.io/certificate-arn: <YOUR_ACM_CERTIFICATE_ARN>
    
    # Use ip routing to bypass NodePort and hit the pods directly
    alb.ingress.kubernetes.io/target-type: ip
    
    # Configure custom health-checks for FastAPI
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # Route everything else (root) to the login-service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: login-service
                port:
                  number: 8000
