# 1. ServiceAccount for ESO (tied to the IAM Role created by Terraform)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: <YOUR_ESO_ROLE_ARN>
---
# 2. SecretStore tells ESO how to authenticate and where to fetch from
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
# 3. ExternalSecret specifies which exact secret to fetch and what to name it locally
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets-fetcher
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: app-secrets # This creates the generic Kubernetes expected by your yaml!
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: <YOUR_NAME_PREFIX>-app-secrets # The name of the AWS Secret created by Terraform
